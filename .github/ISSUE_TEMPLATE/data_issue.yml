name: Dataset or annotation issue
description: Report provenance, license, manifest, split, label, annotation, or leakage concerns.
title: "[Data]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not upload dataset files, face images, participant data, credentials, or machine-specific private paths.

  - type: dropdown
    id: category
    attributes:
      label: Concern type
      options:
        - Provenance or license
        - Download or integrity
        - Manifest or schema
        - Label or annotation
        - Split or leakage
        - Consent or privacy
        - Evaluation protocol
        - Other
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: Dataset and version
      description: Provide the public dataset name, source URL, version/revision, and non-sensitive identifiers.
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: Describe the issue and why it affects validity, reproducibility, privacy, or compliance.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Provide hashes, aggregate counts, schema excerpts, or synthetic examples without redistributing data.

  - type: textarea
    id: resolution
    attributes:
      label: Proposed resolution
      description: Suggest a safe correction, review, or adjudication step.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and licensing checks
      options:
        - label: I did not attach or redistribute dataset media or participant data.
          required: true
        - label: I removed personal identifiers, credentials, and private local paths.
          required: true
