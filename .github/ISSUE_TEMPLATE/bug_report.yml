name: Bug report
description: Report a reproducible defect in code, documentation, or tooling.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not attach private videos, restricted datasets, credentials, or identifying information.

  - type: textarea
    id: summary
    attributes:
      label: Problem summary
      description: Describe the defect and its impact.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence, command, or input.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, commit/version, relevant backend, and camera/audio details when applicable.
      placeholder: Windows 11, Python 3.12, commit abc1234, EAR backend
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste redacted logs, screenshots, or test output. Do not include secrets, personal paths, or private media.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, personal data, private media, and restricted dataset content.
          required: true
        - label: This is not a confidential security vulnerability.
          required: true

